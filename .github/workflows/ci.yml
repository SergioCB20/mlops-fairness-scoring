name: CI - QA Gates Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure DVC remote credentials
        run: |
              dvc remote modify origin --local auth basic
              dvc remote modify origin --local user ${{ secrets.DAGSHUB_USER }}
              dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull dataset from DVC remote
        run: dvc pull

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: QA Gate 1 - Representatividad e Integridad (C1)
        run: pytest tests/test_qa_gate1.py tests/test_qa_gate1_failure_cases.py -v

      - name: QA Gate 2 - No-Leakage Indirecto (C2)
        run: pytest tests/test_qa_gate2.py -v

      - name: QA Gate 3 - Equidad del Modelo base (C3)
        run: pytest tests/test_qa_gate3.py -v
        continue-on-error: true
        id: gate3_base

      - name: QA Gate 3 - Equidad del Modelo mitigado (C3, post-ThresholdOptimizer)
        run: pytest tests/test_qa_gate3_mitigated.py -v
